name: Agent Runner

on:
  workflow_dispatch:
    inputs:
      customer:
        description: Customer slug or all
        required: false
        default: all

permissions:
  contents: write

jobs:
  run-agents:
    runs-on: ubuntu-latest

    steps:
      - name: Pull latest repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run agent-runner workflow
        run: python tools/customer-iq/agent_runner.py --workflow agent-runner --customer "${{ inputs.customer }}"

      - name: Commit updated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add context/customer outputs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(customer-iq): run agent workflow"
          git push
